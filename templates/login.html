<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — Hygd</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    :root { color-scheme: light; }
    body { background: #F7F7F7; min-height: 100vh; display: flex; align-items: center; justify-content: center;
           font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; margin: 0; padding: 16px; }
    .card { max-width: 380px; width: 100%; padding: 28px 24px; border-radius: 10px;
            background: #fff; border-top: 4px solid #A6192E; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
    h1 { font-size: 1.25rem; margin: 0 0 4px 0; color: #1F1F1F; }
    .sub { color: #54585A; font-size: .9rem; margin-bottom: 20px; }
    label { font-size: .9rem; font-weight: 600; color: #54585A; margin-bottom: 4px; display: block; }
    input[type=password] { width: 100%; padding: 10px 12px; border: 1px solid #D0D3D4;
                           border-radius: 6px; font-size: 1rem; }
    input[type=password]:focus { outline: 2px solid #A6192E; outline-offset: 1px; border-color: #A6192E; }
    .btn { width: 100%; margin-top: 16px; padding: 10px; border: 0; border-radius: 6px;
           background: #A6192E; color: #fff; font-weight: 700; font-size: 1rem; cursor: pointer; }
    .btn:hover { background: #8E1327; }
    .err { background: #fdecef; color: #8E1327; padding: 8px 10px; border-radius: 6px;
           border-left: 3px solid #A6192E; font-size: .9rem; margin-bottom: 14px; }
  </style>
</head>
<body>
  <form class="card" method="post" action="/login{% if next_url %}?next={{ next_url | e }}{% endif %}">
    <h1><i class="bi bi-calendar2-week" style="color:#A6192E"></i> Hygd</h1>
    <div class="sub">Sign in to continue.</div>
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password"
           autofocus>
    <noscript><!-- empty-password check happens server-side; dropping the
      required= attribute avoids a Safari bug where autofilled values aren't
      counted as "filled" and the form silently refuses to submit --></noscript>
    {% if next_url %}<input type="hidden" name="next" value="{{ next_url | e }}">{% endif %}
    <button class="btn" type="submit">Sign in</button>
  </form>
</body>
</html>
