<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Hygd — {{ view_label }}</title>
  <link rel="manifest" href="/static/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Hygd">
  <meta name="theme-color" content="#A6192E">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/static/style.css">
  <style>
    /* SFU brand palette — see sfu.ca/communicators-toolkit/visual-identity */
    :root {
      --sfu-red:        #A6192E;   /* Pantone 187 — primary */
      --sfu-red-hover:  #8E1327;
      --sfu-dark-grey:  #54585A;   /* Pantone Cool Grey 11 — secondary */
      --sfu-light-grey: #D0D3D4;
      --sfu-black:      #1F1F1F;
      --sfu-bg:         #F7F7F7;
      --surface:        #FFFFFF;
    }
    body { background: var(--sfu-bg); color: var(--sfu-black); }
    .shift-head { padding: 14px 16px 0; border-bottom: 3px solid var(--sfu-red);
                  background: var(--surface); margin-bottom: 8px; }
    .shift-head h1 { font-size: 1.25rem; margin: 0; color: var(--sfu-black); font-weight: 700; }
    .shift-head .sub { color: var(--sfu-dark-grey); font-size: 0.9rem; padding-bottom: 10px; }
    .shift-head .sub a { color: var(--sfu-red); text-decoration: none; }
    .shift-tabs { padding: 8px 16px; display: flex; gap: 8px; }
    .shift-tabs a { flex: 1; text-align: center; padding: 10px; border-radius: 8px;
                    background: var(--surface); color: var(--sfu-dark-grey);
                    text-decoration: none; font-weight: 600;
                    border: 1px solid var(--sfu-light-grey); }
    .shift-tabs a.active { background: var(--sfu-red); color: white; border-color: var(--sfu-red); }
    .missing-banner { margin: 8px 16px; padding: 10px 14px; border-radius: 8px;
                      background: #fff3cd; color: #664d03; font-weight: 600;
                      border-left: 4px solid var(--sfu-red); }
    .missing-banner.ok { background: #e8f3ec; color: #2d5a3c; border-left-color: #2d5a3c; }
    .ev { margin: 10px 16px; padding: 12px; border: 1px solid var(--sfu-light-grey);
          border-radius: 10px; background: var(--surface); }
    .ev .head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .ev .room { font-weight: 700; font-size: 1.1rem; color: var(--sfu-black); }
    .ev .time { color: var(--sfu-dark-grey); font-variant-numeric: tabular-nums; }
    .ev .title { color: var(--sfu-black); margin-top: 2px; }
    .ev .meta { color: var(--sfu-dark-grey); font-size: 0.85rem; margin-top: 2px; }
    .items { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
    .item { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 6px;
            background: var(--sfu-bg); min-height: 44px; }
    .item .qty { color: var(--sfu-dark-grey); font-size: 0.85rem; min-width: 52px; }
    .item .label { flex: 1; }
    .tick-btn { border: 1px solid var(--sfu-light-grey); background: var(--surface);
                border-radius: 6px; padding: 6px 10px; font-size: 0.85rem;
                min-width: 68px; min-height: 36px; color: var(--sfu-dark-grey); }
    .tick-btn.on.setup   { border-color: var(--sfu-red); background: #FBEAEE; color: var(--sfu-red); }
    .tick-btn.on.checkin { border-color: var(--sfu-dark-grey); background: #E6E7E8; color: var(--sfu-black); }
    .offline { position: fixed; bottom: 12px; left: 12px; right: 12px; padding: 10px;
               border-radius: 8px; text-align: center; font-weight: 600; z-index: 100; }
    .offline.hidden { display: none; }
    .offline.pending { background: #fff3cd; color: #664d03; }
    .offline.offline-mode { background: var(--sfu-red); color: white; }
    .initials-pill { font-size: 0.75rem; color: var(--sfu-black); margin-left: 6px;
                     background: rgba(255,255,255,0.7); padding: 2px 6px; border-radius: 4px;
                     font-variant-numeric: tabular-nums; }
    .ev.all-done { background: #F9EEF0; border-color: #E8C4CB; }
  </style>
</head>
<body>

<div class="shift-head">
  <h1>{{ view_label }} — {{ pretty_date }}</h1>
  <div class="sub">{{ event_count }} event{{ 's' if event_count != 1 else '' }} · you are <span id="whoami">—</span> <a href="#" onclick="changeInitials();return false;">change</a></div>
</div>

<div class="shift-tabs">
  <a href="/today" class="{{ 'active' if view == 'today' else '' }}">Today</a>
  <a href="/tomorrow" class="{{ 'active' if view == 'tomorrow' else '' }}">Tomorrow</a>
  <a href="/" class="">Calendar</a>
</div>

<div id="banner" class="missing-banner" style="display:none"></div>

<div id="events"></div>

<div id="offline-bar" class="offline hidden"></div>

<script>
  window.__SHIFT_VIEW__ = {{ view | tojson }};
  window.__SHIFT_DATE__ = {{ date | tojson }};
</script>
<script src="/static/shift.js"></script>
<script>
  // Register the service worker at the site root so its scope covers / , /today, /tomorrow and /api.
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(function (e) {
      console.warn('SW registration failed:', e);
    });
  }
</script>
</body>
</html>
