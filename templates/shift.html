<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Hygd — {{ view_label }}</title>
  <link rel="manifest" href="/static/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Hygd">
  <meta name="theme-color" content="#0b1f3a">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/static/style.css">
  <style>
    .shift-head { padding: 12px 16px 0; }
    .shift-head h1 { font-size: 1.25rem; margin: 0; }
    .shift-head .sub { color: #6c757d; font-size: 0.9rem; }
    .shift-tabs { padding: 8px 16px; display: flex; gap: 8px; }
    .shift-tabs a { flex: 1; text-align: center; padding: 10px; border-radius: 8px;
                    background: #f1f3f5; color: #212529; text-decoration: none; font-weight: 600; }
    .shift-tabs a.active { background: #0b1f3a; color: white; }
    .missing-banner { margin: 8px 16px; padding: 10px 14px; border-radius: 8px;
                      background: #fff3cd; color: #664d03; font-weight: 600; }
    .missing-banner.ok { background: #d1e7dd; color: #0f5132; }
    .ev { margin: 10px 16px; padding: 12px; border: 1px solid #dee2e6;
          border-radius: 10px; background: white; }
    .ev .head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .ev .room { font-weight: 700; font-size: 1.1rem; }
    .ev .time { color: #495057; font-variant-numeric: tabular-nums; }
    .ev .title { color: #212529; margin-top: 2px; }
    .ev .meta { color: #6c757d; font-size: 0.85rem; margin-top: 2px; }
    .items { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
    .item { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 6px;
            background: #f8f9fa; min-height: 44px; }
    .item .qty { color: #6c757d; font-size: 0.85rem; min-width: 52px; }
    .item .label { flex: 1; }
    .tick-btn { border: 1px solid #adb5bd; background: white; border-radius: 6px;
                padding: 6px 10px; font-size: 0.85rem; min-width: 68px; min-height: 36px;
                color: #495057; }
    .tick-btn.on { border-color: #198754; background: #d1e7dd; color: #0f5132; }
    .tick-btn.on.checkin { border-color: #0d6efd; background: #cfe2ff; color: #084298; }
    .offline { position: fixed; bottom: 12px; left: 12px; right: 12px; padding: 10px;
               border-radius: 8px; text-align: center; font-weight: 600; z-index: 100; }
    .offline.hidden { display: none; }
    .offline.pending { background: #fff3cd; color: #664d03; }
    .offline.offline-mode { background: #f8d7da; color: #842029; }
    .initials-pill { font-size: 0.75rem; color: #495057; margin-left: 6px;
                     background: #e9ecef; padding: 2px 6px; border-radius: 4px; }
    .ev.all-done { background: #f6fbf8; border-color: #badbcc; }
  </style>
</head>
<body>

<div class="shift-head">
  <h1>{{ view_label }} — {{ pretty_date }}</h1>
  <div class="sub">{{ event_count }} event{{ 's' if event_count != 1 else '' }} · you are <span id="whoami">—</span> <a href="#" onclick="changeInitials();return false;">change</a></div>
</div>

<div class="shift-tabs">
  <a href="/today" class="{{ 'active' if view == 'today' else '' }}">Today</a>
  <a href="/tomorrow" class="{{ 'active' if view == 'tomorrow' else '' }}">Tomorrow</a>
  <a href="/" class="">Calendar</a>
</div>

<div id="banner" class="missing-banner" style="display:none"></div>

<div id="events"></div>

<div id="offline-bar" class="offline hidden"></div>

<script>
  window.__SHIFT_VIEW__ = {{ view | tojson }};
  window.__SHIFT_DATE__ = {{ date | tojson }};
</script>
<script src="/static/shift.js"></script>
<script>
  // Register the service worker at the site root so its scope covers / , /today, /tomorrow and /api.
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(function (e) {
      console.warn('SW registration failed:', e);
    });
  }
</script>
</body>
</html>
